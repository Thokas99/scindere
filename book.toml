[book]
title = "Scindere Documentation"
authors = ["Scindere contributors"]
language = "en"
src = "docs"

[build]
build-dir = "target/mdbook"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "/scindere/"
git-repository-url = "https://github.com/Thokas99/scindere"
edit-url-template = "https://github.com/Thokas99/scindere/edit/main/{path}"
additional-css = ["docs/theme/scindere.css"]
