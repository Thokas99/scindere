<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1526 360" role="img" aria-labelledby="title desc">
  <title id="title">Scindere quantification workflow</title>
  <desc id="desc">BAM, genome-matched GTF and barcode inputs are processed and classified with velocyto-derived logic. Molecules are counted in bounded barcode batches using dense scratch arrays, with sparse checkpoints, then streamed to H5AD or Loom output containing spliced, unspliced and ambiguous count layers.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #253746; }
    .node { fill: #f5f8fa; stroke: #788a97; stroke-width: 2; }
    .title { font-size: 20px; font-weight: 700; }
    .detail { font-size: 16px; fill: #526477; }
    .step { fill: #126d68; }
    .step-text { fill: #fff; font-size: 14px; font-weight: 700; }
    .flow { fill: none; stroke: #126d68; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .arrowhead { fill: none; stroke: #126d68; stroke-width: 2; }
    .layer-a { fill: #e5f2f0; }
    .layer-b { fill: #eee9f5; }
    .layer-c { fill: #edf0f4; }
    .layer-a-text { fill: #165d58; }
    .layer-b-text { fill: #5c467d; }
    .layer-c-text { fill: #405467; }
    .symbol-a { fill: #126d68; }
    .symbol-b { fill: #7655a6; }
    .symbol-c { fill: #617386; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5edf3; }
      .node { fill: #1a2430; stroke: #617386; }
      .detail { fill: #b5c2ce; }
      .step { fill: #79d5ca; }
      .step-text { fill: #142c31; }
      .flow { stroke: #79d5ca; }
      .arrowhead { stroke: #79d5ca; }
      .layer-a { fill: #193b39; }
      .layer-b { fill: #302640; }
      .layer-c { fill: #2b3743; }
      .layer-a-text { fill: #b4eee7; }
      .layer-b-text { fill: #e0cff7; }
      .layer-c-text { fill: #d0dae3; }
      .symbol-a { fill: #79d5ca; }
      .symbol-b { fill: #c2a9e2; }
      .symbol-c { fill: #b5c2ce; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path class="arrowhead" d="M1 1l7 4-7 4"/>
    </marker>
  </defs>

  <g>
    <rect class="node" x="28" y="48" width="270" height="264" rx="14"/>
    <circle class="step" cx="163" cy="80" r="16"/><text class="step-text" x="163" y="85" text-anchor="middle">1</text>
    <text class="title" x="163" y="126" text-anchor="middle">Inputs</text>
    <text class="detail" x="50" y="174">BAM alignments</text>
    <text class="detail" x="50" y="205">Genome-matched GTF</text>
    <text class="detail" x="50" y="236">Cell barcodes</text>

    <path class="flow" d="M302 180h25" marker-end="url(#arrow)"/>
    <rect class="node" x="334" y="48" width="270" height="264" rx="14"/>
    <circle class="step" cx="469" cy="80" r="16"/><text class="step-text" x="469" y="85" text-anchor="middle">2</text>
    <text class="title" x="469" y="126" text-anchor="middle">Alignment processing</text>
    <text class="detail" x="356" y="174">Group alignments by</text>
    <text class="detail" x="356" y="200">barcode and collect</text>
    <text class="detail" x="356" y="226">molecule evidence</text>

    <path class="flow" d="M608 180h25" marker-end="url(#arrow)"/>
    <rect class="node" x="640" y="48" width="270" height="264" rx="14"/>
    <circle class="step" cx="775" cy="80" r="16"/><text class="step-text" x="775" y="85" text-anchor="middle">3</text>
    <text class="title" x="775" y="126" text-anchor="middle">Molecule classification</text>
    <text class="detail" x="662" y="174">Velocyto-derived logic</text>
    <text class="detail" x="662" y="200">assigns splicing states</text>

    <path class="flow" d="M914 180h25" marker-end="url(#arrow)"/>
    <rect class="node" x="946" y="48" width="270" height="264" rx="14"/>
    <circle class="step" cx="1081" cy="80" r="16"/><text class="step-text" x="1081" y="85" text-anchor="middle">4</text>
    <text class="title" x="1081" y="126" text-anchor="middle">Bounded counting</text>
    <text class="detail" x="968" y="174">Barcode batches use</text>
    <text class="detail" x="968" y="200">bounded dense scratch</text>
    <text class="detail" x="968" y="226">Sparse checkpoints</text>

    <path class="flow" d="M1220 180h25" marker-end="url(#arrow)"/>
    <rect class="node" x="1252" y="48" width="246" height="264" rx="14"/>
    <circle class="step" cx="1375" cy="80" r="16"/><text class="step-text" x="1375" y="85" text-anchor="middle">5</text>
    <text class="title" x="1375" y="126" text-anchor="middle">H5AD / Loom</text>
    <text class="detail" x="1274" y="155">Count layers</text>
    <rect class="layer-a" x="1274" y="170" width="202" height="32" rx="8"/>
    <circle class="symbol-a" cx="1291" cy="186" r="5"/>
    <text class="detail layer-a-text" x="1305" y="192">Spliced</text>
    <rect class="layer-b" x="1274" y="209" width="202" height="32" rx="8"/>
    <path class="symbol-b" d="M1291 216l7 9-7 9-7-9z"/>
    <text class="detail layer-b-text" x="1305" y="231">Unspliced</text>
    <rect class="layer-c" x="1274" y="248" width="202" height="32" rx="8"/>
    <rect class="symbol-c" x="1285" y="258" width="12" height="12" rx="1"/>
    <text class="detail layer-c-text" x="1305" y="270">Ambiguous</text>
  </g>
</svg>
