name: Bug report
description: Report a reproducible problem with Scindere.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Include commands and synthetic or non-sensitive example data where possible.
  - type: input
    id: version
    attributes:
      label: Scindere version
      placeholder: scindere 0.1.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: Include the command, operating system, Rust version and relevant input formats.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message or a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
