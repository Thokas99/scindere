name: Scindere documentation

on:
  push:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - README.md
      - ROADMAP.md
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - book.toml
      - docs/**
      - README.md
      - ROADMAP.md
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          cargo install --locked --version 0.5.4 mdbook --root "$RUNNER_TEMP/scindere-mdbook"
          echo "$RUNNER_TEMP/scindere-mdbook/bin" >> "$GITHUB_PATH"
      - name: Build documentation
        run: mdbook build --dest-dir target/mdbook
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/mdbook
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
